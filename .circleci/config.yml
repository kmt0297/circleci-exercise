version: 2.1

jobs:
  build:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build and push test image to Docker Hub
          command: |
            echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USER" --password-stdin
            docker build -t 021997/circleci-exercise:$CIRCLE_SHA1 .
            docker push 021997/circleci-exercise:$CIRCLE_SHA1

  test:
    docker:
      - image: 021997/circleci-exercise:<< pipeline.git.revision >>
      - image: cimg/postgres:16.4
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
    environment:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
    working_directory: /app
    steps:
      - run:
          name: Wait for Postgres
          command: ./scripts/wait-for-db.sh
      - run:
          name: Run tests
          command: mkdir -p test-results && pytest --junitxml=test-results/junit.xml
      - store_test_results:
          path: test-results

  deploy:
    docker:
      - image: mcr.microsoft.com/azure-cli:latest
    steps:
      - run:
          name: Log in to Azure with OIDC (no stored secrets)
          command: |
            az login --service-principal \
              --username "$AZURE_CLIENT_ID" \
              --tenant "$AZURE_TENANT_ID" \
              --federated-token "$CIRCLE_OIDC_TOKEN"
      - run:
          name: Copy tested image from Docker Hub into ACR
          command: |
            az acr import --name "$ACR_NAME" \
              --source docker.io/021997/circleci-exercise:$CIRCLE_SHA1 \
              --image circleci-exercise:$CIRCLE_SHA1

workflows:
  build-test-deploy:
    jobs:
      - build:
          context: dockerhub
      - test:
          requires: [build]
      - deploy:
          requires: [test]
          context: azure-deploy
          filters:
            branches:
              only: main
